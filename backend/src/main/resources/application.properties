spring.application.name=HireSense

# Development database. No password here: the PostgreSQL JDBC driver reads it from
# %APPDATA%\postgresql\pgpass.conf (outside the project). Host must be spelled "localhost".
spring.datasource.url=jdbc:postgresql://localhost:5432/hiresense
spring.datasource.username=hiresense_app

# JPA never creates or changes tables. Flyway migrations own the schema.
spring.jpa.hibernate.ddl-auto=none

# Flyway migrates as the owner role. No password here: the PostgreSQL JDBC driver reads it
# from %APPDATA%\postgresql\pgpass.conf (verified in isolation on 2026-11-19).
spring.flyway.url=jdbc:postgresql://localhost:5432/hiresense
spring.flyway.user=hiresense_owner

# Actuator: expose only the health endpoint and no details (NFR-019).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
