spring.application.name=HireSense

# Test database. Replaces src/main/resources/application.properties while tests run.
# No password here: the PostgreSQL JDBC driver reads it from %APPDATA%\postgresql\pgpass.conf.
spring.datasource.url=jdbc:postgresql://localhost:5432/hiresense_test
spring.datasource.username=hiresense_app

spring.jpa.hibernate.ddl-auto=none

# Flyway migrates the TEST database as the owner role (password from pgpass.conf).
spring.flyway.url=jdbc:postgresql://localhost:5432/hiresense_test
spring.flyway.user=hiresense_owner

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
